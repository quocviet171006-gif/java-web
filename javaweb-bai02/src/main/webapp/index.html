<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Murach's Java Servlets and JSP</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <main>
        <img src="images/murach_logo.png" alt="Murach logo" class="logo">

        <h1>Survey</h1>
        <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

        <form action="survey" method="post">
            <section>
                <h2>Your information:</h2>
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" name="firstName"><br>

                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" name="lastName"><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"><br>

                <label for="birthDate">Date of Birth:</label>
                <input type="date" id="birthDate" name="birthDate"><br>
            </section>

            <section>
                <h2>How did you hear about us?</h2>
                <label><input type="radio" name="source" value="search" checked> Search engine</label>
                <label><input type="radio" name="source" value="word"> Word of mouth</label>
                <label><input type="radio" name="source" value="social"> Social Media</label>
                <label><input type="radio" name="source" value="other"> Other</label>
            </section>

            <section>
                <h2>Would you like to receive announcements<br>
                    about new CDs and special offers?</h2>
                <p><label><input type="checkbox" name="announcements" value="yes">
                    YES, I'd like that.</label></p>
                <p><label><input type="checkbox" name="newProducts" value="yes">
                    YES, please send me information about new products.</label></p>

                <div class="contact-row">
                    <label for="contactBy">Please contact me by:</label>
                    <select id="contactBy" name="contactBy" multiple size="3">
                        <option value="email_postal">Email or postal mail</option>
                        <option value="email">Email only</option>
                        <option value="postal">Postal mail only</option>
                    </select>
                </div>
            </section>

            <p><button type="submit">Submit</button></p>
        </form>
    </main>
</body>
</html>
